[package]
name = "native"
description = "Desktop + mobile app: Tauri 2 with Holochain's official runtime (tauri-plugin-hc)."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

# Mobile targets load the app as a library; desktop runs src/main.rs.
[lib]
name = "native_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "social-production"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The conductor's WASM engine (cranelift JIT, or wasmi on iOS) is chosen by the
# runtime crate per target; nothing to select here.
holochain = { workspace = true, features = ["encryption", "schema"] }
log = "0.4"
rand = "0.8"
tauri = { version = "2.12", features = [] }
tauri-plugin-hc = "=0.1.0"
tauri-plugin-log = "2"
serde_json = "1"
sp_core = { workspace = true }
url2 = "0.0.6"

[lints]
workspace = true
