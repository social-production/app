[package]
name = "native"
description = "Desktop + mobile app: Tauri 2 with Holochain's official runtime (tauri-plugin-hc)."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

# Mobile targets load the app as a library; desktop runs src/main.rs.
[lib]
name = "native_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "social-production"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# The conductor's WASM engine (cranelift JIT, or wasmi on iOS) is chosen by the
# runtime crate per target; nothing to select here.
# Place lookups from the device, as the gateway does them (ADR 0093).
geo = { workspace = true }
holochain = { workspace = true, features = ["encryption", "schema"] }
# Same pins as the gateway (ADR 0090: the account is the phrase's seed, as on a gateway).
holo_hash = { version = "=0.7.1", features = ["encoding"] }
holochain_types = "=0.7.1"
log = "0.4"
rand = "0.8"
# Already in the tree (the plugin uses it): probe each bootstrap's /health at start (ADR 0091).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# custom-protocol: serve the bundled ui/build (without it Tauri loads devUrl, a dev server).
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-hc = "=0.1.0"
tauri-plugin-log = "2"
tokio = { workspace = true, features = ["time"] }
serde_json = "1"
sodoken = "0.1"
sp_core = { workspace = true }
url2 = "0.0.6"

[lints]
workspace = true
