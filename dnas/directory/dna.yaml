# Global network: profiles, standing and vouches, project index, feeds.
# Zome WASM comes from scripts/build-zomes.sh (cargo --profile zome).
manifest_version: "0"
name: sp_directory
integrity:
  network_seed: ~
  # Part of the DNA hash: changing anything here starts a new network.
  properties:
    kind: directory
    # Founders start with Full standing so the vouch chain can begin
    # (docs/GOVERNANCE.md#standing). Test network founders (2026-10-18); the real
    # launch uses fresh keys for a fresh network.
    founders:
      - name: thebestdamn
        agent: uhCAkVzM3E-2KG_M2homDJ0A3w3W18KADL0GzdimGmGTAFaHrqspy
      - name: BigBird
        agent: uhCAkMGeYLUjiwSGs0yzl9qIDA_VMyJxEH4qCtxv4YAcF4gIkqWRS
  zomes:
    - name: health_integrity
      path: ../../target/wasm32-unknown-unknown/zome/health_integrity.wasm
    - name: identity_integrity
      path: ../../target/wasm32-unknown-unknown/zome/identity_integrity.wasm
coordinator:
  zomes:
    - name: health
      path: ../../target/wasm32-unknown-unknown/zome/health.wasm
      dependencies:
        - name: health_integrity
    - name: identity
      path: ../../target/wasm32-unknown-unknown/zome/identity.wasm
      dependencies:
        - name: identity_integrity
