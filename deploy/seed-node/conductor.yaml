# Seed-node conductor. ${...} values are filled by entrypoint.sh from the environment.
# Admin port is bound to localhost only: the gateway is the sole admin client.
data_root_path: ${DATA_DIR}/conductor
keystore:
  type: lair_server_in_proc
admin_interfaces:
  - driver:
      type: websocket
      port: ${ADMIN_PORT}
      allowed_origins: "*"
network:
  bootstrap_url: ${BOOTSTRAP_URL}
  relay_url: ${RELAY_URL}
  # Full arc: the seed node holds everything (ADR 0005, docs/NETWORK.md).
  target_arc_factor: 1
