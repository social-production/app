name: ci

# While the app is a prototype (owner, 2026-11-16), PRs get only the fast check (minutes):
# docs-only PRs run nothing, everything else runs scripts/check-fast.sh. The ~2 h scenarios run
# only on main, every night (~3 am Melbourne) or on demand (Run workflow). Bring the scenarios
# back to PRs once there is a stable release with real users.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 16 * * *' # ~3 am Melbourne
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # What this run needs. Skipped jobs count as passed for required checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      check: ${{ steps.pick.outputs.check }}
      scenarios: ${{ steps.pick.outputs.scenarios }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; echo "scenarios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = push ]; then
            echo "check=true" >> "$GITHUB_OUTPUT"; echo "scenarios=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          printf '%s\n' "$files"
          code=$(printf '%s\n' "$files" | grep -vE '(\.md$|^docs/)' || true)
          echo "check=$([ -n "$code" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "scenarios=false" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # Holochain's public binary cache: holochain/hc come prebuilt.
      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
      # tauri-plugin-hc's build script writes permission files into its registry source,
      # which the cache doesn't keep; rerun it so its cached output never points at
      # missing files.
      - name: Refresh Tauri plugin build output
        run: nix develop --accept-flake-config --command cargo clean -p tauri-plugin-hc
      - name: Install npm dependencies
        run: nix develop --accept-flake-config --command npm ci
      - name: Everything but the scenarios (scripts/check-fast.sh)
        run: nix develop --accept-flake-config --command bash scripts/check-fast.sh

  # The multi-conductor scenarios take ~680 min in one job; scripts/check-scenarios.sh deals the
  # files into 8 shards of ~85 min by their measured times (new files need no change here).
  scenarios:
    name: scenarios (${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.scenarios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scenarios
      - name: Pack the hApp (scripts/build-happ.sh)
        run: nix develop --accept-flake-config --command bash scripts/build-happ.sh
      - name: Scenarios, shard ${{ matrix.shard }} of 8
        run: nix develop --accept-flake-config --command bash scripts/check-scenarios.sh ${{ matrix.shard }} 8
