name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # Holochain's public binary cache: holochain/hc come prebuilt.
      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
      # tauri-plugin-hc's build script writes permission files into its registry source,
      # which the cache doesn't keep; rerun it so its cached output never points at
      # missing files.
      - name: Refresh Tauri plugin build output
        run: nix develop --accept-flake-config --command cargo clean -p tauri-plugin-hc
      - name: Install npm dependencies
        run: nix develop --accept-flake-config --command npm ci
      - name: Everything (scripts/check-all.sh)
        run: nix develop --accept-flake-config --command bash scripts/check-all.sh
