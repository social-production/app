name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      # Holochain's public binary cache: holochain/hc come prebuilt.
      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
      # tauri-plugin-hc's build script writes permission files into its registry source,
      # which the cache doesn't keep; rerun it so its cached output never points at
      # missing files.
      - name: Refresh Tauri plugin build output
        run: nix develop --accept-flake-config --command cargo clean -p tauri-plugin-hc
      - name: Install npm dependencies
        run: nix develop --accept-flake-config --command npm ci
      - name: Everything but the scenarios (scripts/check-fast.sh)
        run: nix develop --accept-flake-config --command bash scripts/check-fast.sh

  # The multi-conductor scenarios took ~130 min in one job; each shard runs a quarter of the
  # files (scripts/check-scenarios.sh picks them, so new files need no change here).
  scenarios:
    name: scenarios (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scenarios
      - name: Pack the hApp (scripts/build-happ.sh)
        run: nix develop --accept-flake-config --command bash scripts/build-happ.sh
      - name: Scenarios, shard ${{ matrix.shard }} of 4
        run: nix develop --accept-flake-config --command bash scripts/check-scenarios.sh ${{ matrix.shard }} 4
