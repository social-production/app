name: desktop

# The desktop app (native/, ADR 0021/0090) built on Linux, Windows and macOS, with a smoke
# test of the real app on Linux (SEEDLESS step 1). The UI and the hApp are built once in
# Nix and handed to the stock-toolchain builds, which is how a person would build the app.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - native/**
      - services/geo/**
      - ui/**
      - crates/**
      - zomes/**
      - dnas/**
      - happ/**
      - vendor/**
      - tests/desktop/**
      - .github/workflows/desktop.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - native/**
      - services/geo/**
      - ui/**
      - crates/**
      - zomes/**
      - dnas/**
      - happ/**
      - vendor/**
      - tests/desktop/**
      - .github/workflows/desktop.yml

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  # The test network's seed node: the desktop UI still reads the feed index from a gateway
  # until SEEDLESS step 4 moves it onto the device.
  VITE_SP_GATEWAYS: https://seed-node-production.up.railway.app

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: holochain-ci
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: scenarios
          save-if: false
      - run: nix develop --accept-flake-config --command npm ci
      - run: nix develop --accept-flake-config --command npm run build -w ui
      - run: nix develop --accept-flake-config --command bash scripts/build-happ.sh
      # The smoke test compares it with the live seed's: a PR that resets the directory
      # can't share the live network until it is deployed.
      - run: nix develop --accept-flake-config --command hc dna hash dnas/directory/sp_directory.dna > happ/directory-dna-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            ui/build
            happ/social_production.happ
            happ/directory-dna-hash.txt
          retention-days: 3

  build:
    needs: bundle
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Tauri's Linux libraries, WebKit's WebDriver and a virtual display
        if: runner.os == 'Linux'
        timeout-minutes: 30
        run: |
          # The runners' Ubuntu mirrors sometimes fail to resolve for a while (2026-11-11: two
          # runs died here before building): retry each download, and the whole step 3 times.
          apt="sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          for try in 1 2 3; do
            if $apt update && $apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev xvfb &&
              # WebKitWebDriver: `webkitgtk-webdriver` from Ubuntu 26.04, `webkit2gtk-driver` before.
              { $apt install -y webkitgtk-webdriver || $apt install -y webkit2gtk-driver; }; then
              exit 0
            fi
            echo "apt failed (try $try); retrying in 60 s"
            sleep 60
          done
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Build the app
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: |
          # Vendored OpenSSL needs a full Perl; Git Bash's lacks Locale::Maketext::Simple.
          if [ "$RUNNER_OS" = Windows ]; then export OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe; fi
          # tauri-plugin-hc's build script writes permission files into its registry source,
          # which the cache doesn't keep (as in ci.yml): rerun it.
          cargo clean --release -p tauri-plugin-hc
          cargo build --release -p native
      - name: Smoke test (sign up, profile, sign out, log in with the words)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver --locked
          export SP_NET_LOG=1
          xvfb-run -a bash -c '
            tauri-driver & driver=$!
            sleep 2
            node tests/desktop/smoke.mjs target/release/social-production; status=$?
            kill $driver
            if [ $status -ne 0 ]; then
              echo "--- app log (tauri-plugin-log) ---"
              find ~/.local/share ~/.config -path "*socialproduction*" -name "*.log" -exec tail -n 150 {} \;
            fi
            exit $status'
      - uses: actions/upload-artifact@v4
        with:
          name: social-production-${{ runner.os }}
          path: |
            target/release/social-production
            target/release/social-production.exe
          if-no-files-found: error
          retention-days: 7
