name: platforms

# M0 platform check (ADR 0011): does the embedded conductor build for phones?
# iOS forbids JIT, so it must use the wasmer-wasmi interpreter; Android may JIT.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - native/**
      - tests/mobile-conductor/**
      - .github/workflows/platforms.yml

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    # Known blocker (ADR 0020): Holochain 0.7's keystore needs sysinfo ^0.38, which does
    # not compile for iOS. Kept running so we notice the day it goes green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: Conductor for iOS (interpreter, no JIT)
        run: cargo build --release -p mobile-conductor --features wasmi --target aarch64-apple-ios

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Conductor for Android (JIT)
        run: |
          # GitHub's Ubuntu image ships the Android NDK.
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          # Vendored OpenSSL's makefile calls <triple>-ranlib; the NDK only ships llvm-ranlib.
          mkdir -p "$RUNNER_TEMP/ndk-shims"
          ln -sf "$bin/llvm-ranlib" "$RUNNER_TEMP/ndk-shims/aarch64-linux-android-ranlib"
          export PATH="$RUNNER_TEMP/ndk-shims:$PATH"
          cargo build --release -p mobile-conductor --features jit --target aarch64-linux-android
