[package]
name = "gateway"
description = "Seed node: embedded conductor + HTTP gateway (passkeys, hosted agents, sessions, ws proxy)."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
holo_hash = { version = "=0.7.1", features = ["encoding"] }
holochain = { workspace = true, features = ["wasmer-sys-cranelift", "encryption", "schema"] }
holochain_keystore = "=0.7.1"
holochain_types = "=0.7.1"
lair_keystore_api = "=0.7.1"
mr_bundle = "=0.7.1"
# Turns off transparent huge pages for the process (ADR 0066).
nix = { version = "0.31", default-features = false, features = ["process"] }
rand = "0.8"
rmpv = { version = "1", features = ["with-serde"] }
rustls = "0.23"
serde = { workspace = true }
serde_json = "1"
sp_core = { workspace = true }
sp_index = { workspace = true }
sp_scope = { workspace = true }
sha2 = "0.10"
sodoken = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
# The allocator (ADR 0060): glibc malloc kept ~1.1 GB idle; jemalloc ~0.7 GB. Unprefixed, so
# C code (SQLite) allocates through it too instead of glibc's arenas (ADR 0066).
tikv-jemallocator = { version = "0.6", optional = true, features = ["unprefixed_malloc_on_supported_platforms"] }
# jemalloc's own figures in /readyz (ADR 0064): live data vs allocator overhead.
tikv-jemalloc-ctl = { version = "0.6", optional = true, features = ["stats"] }
tokio-tungstenite = "0.28"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url2 = "0.0.6"
uuid = { version = "1", features = ["v4"] }
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }

[features]
# On for the seed node's release build (deploy/seed-node/Dockerfile, `RELEASE=1` dev seed).
# Off by default: jemalloc's configure fails in debug builds under Nix's hardening flags.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[lints]
workspace = true
