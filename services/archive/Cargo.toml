[package]
name = "archive"
description = "The feed index (SEEDLESS phase B): the archivist's round, people search and feed/map/region queries, shared by the gateway and (next) the desktop app."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow = "1"
holo_hash = { version = "=0.7.1", features = ["encoding"] }
holochain_types = "=0.7.1"
serde = { workspace = true }
sp_core = { workspace = true }
sp_discussion = { workspace = true }
sp_index = { workspace = true }
sp_place = { workspace = true }
sp_scope = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["sync", "macros", "rt"] }

[lints]
workspace = true
