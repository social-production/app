<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=4" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#181a1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Social Production" />
    <!-- As on web/src/app.html: apply the saved theme, accent and font before first paint. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sp_theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme;
            document.body && (document.body.dataset.theme = theme);
            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) {
              themeMeta.setAttribute('content', theme === 'light' ? '#ffffff' : '#181a1b');
            }
          }
          // Accent and font too, so the first paint isn't green Inter for everyone.
          var accent = localStorage.getItem('sp_accent');
          var font = localStorage.getItem('sp_font');
          var textSize = localStorage.getItem('sp_text_size');
          if (textSize) document.documentElement.dataset.textSize = textSize;
          if (accent) document.documentElement.dataset.accent = accent;
          if (font) document.documentElement.dataset.font = font;
          if (localStorage.getItem('sp_back_buttons') === 'off') {
            document.documentElement.dataset.backButtons = 'off';
          }
        } catch (e) {}
      })();
    </script>
    <!-- Before the app's code arrives (owner, 2026-11-19: "just use the same one we use for
         loading"): the feed's breathing grey cards, drawn here because the app's own styles
         aren't loaded yet. The shell removes it once it mounts and shows its own (OpeningScreen). -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 72px 16px 16px;
        overflow: hidden;
        background: #ffffff;
        color: #71717a;
        font:
          13px/1.4 Inter,
          system-ui,
          -apple-system,
          sans-serif;
        transition: opacity 0.2s ease;
        --sk: rgb(24 24 27 / 0.09);
        --card: #ffffff;
      }
      #boot-splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash p {
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        text-align: center;
      }
      #boot-splash .c {
        display: grid;
        gap: 10px;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding: 16px;
        border-radius: 16px;
        background: var(--card);
      }
      #boot-splash .c i {
        display: block;
        height: 11px;
        border-radius: 999px;
        background: var(--sk);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot-splash .c i:first-child {
        width: 38%;
      }
      #boot-splash .c i:nth-child(2) {
        width: 70%;
        height: 16px;
      }
      #boot-splash .c i:last-child {
        width: 64%;
      }
      [data-theme='dark'] #boot-splash {
        background: #181a1b;
        color: #bbc0c9;
        --sk: rgb(243 244 246 / 0.09);
        --card: #1e1f22;
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .c i {
          animation: none;
        }
      }
    </style>
    <title>Social Production</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash" role="status">
      <p>Connecting to the network</p>
      <div class="c"><i></i><i></i><i></i><i></i></div>
      <div class="c"><i></i><i></i><i></i><i></i></div>
      <div class="c"><i></i><i></i><i></i><i></i></div>
      <div class="c"><i></i><i></i><i></i><i></i></div>
    </div>
    <!-- The opening screen in the chosen language (owner, 2026-11-19), worked out as the app
         does (i18n/index.ts): this device's choice, else the main language. The app's own
         catalogue isn't loaded yet, so the line is here for each language. -->
    <script>
      (function () {
        var lines = { ru: 'Подключение к сети' };
        var lang = '';
        try {
          lang = localStorage.getItem('sp_language') || '';
        } catch (e) {}
        if (!lang)
          lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        lang = lang.toLowerCase().split('-')[0];
        if (lang === 'en' || !lines[lang]) return;
        document.documentElement.lang = lang;
        var p = document.querySelector('#boot-splash p');
        if (p && p.firstChild) p.firstChild.nodeValue = lines[lang];
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
