<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=4" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#181a1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Social Production" />
    <!-- As on web/src/app.html: apply the saved theme, accent and font before first paint. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sp_theme');
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme;
            document.body && (document.body.dataset.theme = theme);
            var themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) {
              themeMeta.setAttribute('content', theme === 'light' ? '#ffffff' : '#181a1b');
            }
          }
          // Accent and font too, so the first paint isn't green Inter for everyone.
          var accent = localStorage.getItem('sp_accent');
          var font = localStorage.getItem('sp_font');
          var textSize = localStorage.getItem('sp_text_size');
          if (textSize) document.documentElement.dataset.textSize = textSize;
          if (accent) document.documentElement.dataset.accent = accent;
          if (font) document.documentElement.dataset.font = font;
          if (localStorage.getItem('sp_back_buttons') === 'off') {
            document.documentElement.dataset.backButtons = 'off';
          }
        } catch (e) {}
      })();
    </script>
    <!-- The opening screen before the app's code arrives (owner's fix 3c, quietened on
         2026-11-19): the logo mark, the name and a thin moving line, on the page's own colour.
         It fades in only after 0.4 s, so a quick open goes straight to the feed's skeletons;
         the app removes it once the first connection settles. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        background: #ffffff;
        color: #18181b;
        font:
          15px/1.4 Inter,
          system-ui,
          -apple-system,
          sans-serif;
        text-align: center;
        transition: opacity 0.25s ease;
      }
      #boot-splash > * {
        animation: boot-in 0.35s ease-out 0.4s both;
      }
      #boot-splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      #boot-splash .logo {
        width: 40px;
        height: 40px;
        background: #2f8a57;
        -webkit-mask: url('%sveltekit.assets%/icon-monochrome-512.v4.png') center / contain
          no-repeat;
        mask: url('%sveltekit.assets%/icon-monochrome-512.v4.png') center / contain no-repeat;
      }
      #boot-splash strong {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      #boot-splash .track {
        position: relative;
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(24 24 27 / 0.08);
      }
      #boot-splash .track::before {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 999px;
        background: #2f8a57;
        animation: boot-slide 1.3s ease-in-out infinite;
        content: '';
      }
      #boot-splash p {
        max-width: 260px;
        margin: 0;
        color: #71717a;
        font-size: 13px;
      }
      [data-theme='dark'] #boot-splash {
        background: #181a1b;
        color: #f3f4f6;
      }
      [data-theme='dark'] #boot-splash .logo,
      [data-theme='dark'] #boot-splash .track::before {
        background: #5dd691;
      }
      [data-theme='dark'] #boot-splash .track {
        background: rgb(243 244 246 / 0.1);
      }
      [data-theme='dark'] #boot-splash p {
        color: #bbc0c9;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash > *,
        #boot-splash .track::before {
          animation: none;
        }
      }
    </style>
    <title>Social Production</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="boot-splash" role="status">
      <span class="logo"></span>
      <strong>Social Production</strong>
      <span class="track"></span>
      <p>Connecting to the network</p>
    </div>
    <!-- The opening screen in the chosen language (owner, 2026-11-19), worked out as the app
         does (i18n/index.ts): this device's choice, else the main language. The app's own
         catalogue isn't loaded yet, so the line is here for each language. -->
    <script>
      (function () {
        var lines = { ru: 'Подключение к сети' };
        var lang = '';
        try {
          lang = localStorage.getItem('sp_language') || '';
        } catch (e) {}
        if (!lang)
          lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        lang = lang.toLowerCase().split('-')[0];
        if (lang === 'en' || !lines[lang]) return;
        document.documentElement.lang = lang;
        var p = document.querySelector('#boot-splash p');
        if (p && p.firstChild) p.firstChild.nodeValue = lines[lang];
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
